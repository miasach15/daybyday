<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>daybyday — weekly</title>
  <style>
    :root{
      --paper-0:#fbfaf8;
      --paper-1:#f6f2ee;
      --paper-2:#efe7e1;
      --paper-3:#e6dad1;
      --blush-1:#feecef;
      --blush-2:#fbd6de;
      --blush-3:#f6b7c6;
      --ink-1:#1f2937;
      --ink-2:#4b5563;
      --ink-3:#6b7280;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 600px at 20% 0%, var(--blush-1) 0%, transparent 55%),
                  radial-gradient(1200px 600px at 90% 10%, #ffffff 0%, transparent 60%),
                  var(--paper-0);
      color:var(--ink-1);
    }
    a{color:inherit;text-decoration:none}
    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 16px 60px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 14px 14px;
      border: 1px solid var(--paper-2);
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      position: sticky;
      top: 14px;
      z-index: 10;
    }
    .brand{
      display:flex;
      align-items:baseline;
      gap:10px;
    }
    .brand h1{
      margin:0;
      font-family: ui-serif, Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.2px;
      font-size: 22px;
    }
    .brand .tag{
      font-size: 12px;
      color: var(--ink-3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .btn{
      border: 1px solid var(--paper-2);
      background: white;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
      cursor:pointer;
      font-size: 13px;
      color: var(--ink-2);
      transition: transform .05s ease, background .15s ease;
    }
    .btn:hover{background: var(--paper-0)}
    .btn:active{transform: translateY(1px)}
    .btn.primary{
      border-color: var(--blush-2);
      background: linear-gradient(180deg, #fff 0%, var(--blush-1) 100%);
      color: var(--ink-1);
    }
    .btn.danger{
      border-color: #f2b0b0;
      background: linear-gradient(180deg, #fff 0%, #ffeaea 100%);
      color: #7a1f1f;
    }
    .grid{
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns: 1fr}
      header{position:static}
    }
    .card{
      background: rgba(255,255,255,0.85);
      border: 1px solid var(--paper-2);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .head{
      padding: 14px 16px;
      border-bottom: 1px solid var(--paper-2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .card .head .title{
      display:flex; flex-direction:column; gap:3px;
    }
    .card .head .title b{
      font-weight: 600;
      letter-spacing: .2px;
    }
    .card .head .title span{
      font-size: 12px;
      color: var(--ink-3);
    }
    .card .body{padding: 14px 16px}
    .row{display:flex; gap:10px; flex-wrap: wrap; align-items:center}
    .pill{
      border: 1px solid var(--paper-2);
      background: white;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--ink-2);
    }
    .week{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    @media (max-width: 980px){
      .week{grid-template-columns: 1fr}
    }
    .day{
      border: 1px solid var(--paper-2);
      background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(251,250,248,0.9) 100%);
      border-radius: 16px;
      padding: 10px;
      min-height: 160px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .dayTop{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:8px;
    }
    .dow{
      font-size: 12px;
      color: var(--ink-3);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .date{
      font-size: 12px;
      color: var(--ink-2);
    }
    .events{display:flex; flex-direction:column; gap:8px; flex:1}
    .event{
      border: 1px solid var(--paper-2);
      border-left: 4px solid var(--blush-3);
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 8px 8px 8px 10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      transition: transform .05s ease;
    }
    .event:active{transform: translateY(1px)}
    .event .left{display:flex; flex-direction:column; gap:2px}
    .event .name{font-size: 13px; font-weight: 600; color: var(--ink-1)}
    .event .meta{font-size: 12px; color: var(--ink-3)}
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size: 11px;
      color: var(--ink-2);
      border: 1px solid var(--paper-2);
      background: white;
      padding: 4px 8px;
      border-radius: 999px;
      width: fit-content;
    }
    .dot{
      width: 10px; height: 10px; border-radius: 999px;
      background: var(--blush-3);
      border: 1px solid rgba(0,0,0,0.06);
    }
    .addSmall{
      width:100%;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px dashed var(--paper-3);
      background: rgba(255,255,255,0.6);
      cursor:pointer;
      color: var(--ink-2);
      font-size: 12px;
    }
    .addSmall:hover{background: rgba(255,255,255,0.9)}
    .section{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    label{font-size: 12px; color: var(--ink-3)}
    input, textarea, select{
      width:100%;
      border: 1px solid var(--paper-2);
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 10px 10px;
      font-size: 13px;
      color: var(--ink-1);
      outline:none;
    }
    textarea{min-height: 90px; resize: vertical}
    .two{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .three{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 980px){
      .two,.three{grid-template-columns:1fr}
    }
    .muted{color:var(--ink-3); font-size:12px}
    .divider{height:1px; background: var(--paper-2); margin: 10px 0}
    .modalOverlay{
      position:fixed; inset:0;
      background: rgba(17,24,39,0.35);
      display:none;
      align-items:center; justify-content:center;
      padding: 18px;
      z-index: 50;
    }
    .modalOverlay.show{display:flex}
    .modal{
      width: min(560px, 100%);
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--paper-2);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .modal .head{
      padding: 14px 16px;
      border-bottom: 1px solid var(--paper-2);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .modal .head b{font-family: ui-serif, Georgia, serif; font-size:16px}
    .modal .body{padding: 14px 16px}
    .rightActions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
    footer{
      margin-top: 14px;
      color: var(--ink-3);
      font-size: 12px;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>daybyday</h1>
        <div class="tag">weekly</div>
      </div>
      <div class="row">
        <button class="btn" id="prevWeek">←</button>
        <div class="pill" id="weekLabel">Week</div>
        <button class="btn" id="nextWeek">→</button>
        <button class="btn primary" id="newEventBtn">New event</button>
      </div>
    </header>

    <div class="grid">
      <!-- LEFT: Weekly Calendar -->
      <section class="card">
        <div class="head">
          <div class="title">
            <b>Your week</b>
            <span>Click a day to add, click an event to edit.</span>
          </div>
          <div class="row">
            <span class="pill" id="todayPill"></span>
          </div>
        </div>
        <div class="body">
          <div class="week" id="weekGrid"></div>
        </div>
      </section>

      <!-- RIGHT: Aesthetic / categories / quick lists -->
      <aside class="card">
        <div class="head">
          <div class="title">
            <b>Soft structure</b>
            <span>Categories + quick notes (saved locally).</span>
          </div>
        </div>
        <div class="body section">
          <div>
            <label>Categories</label>
            <div class="row" id="categoryChips"></div>
            <div class="muted" style="margin-top:8px;">Tip: edit category names/colors in the code if you want.</div>
          </div>

          <div class="divider"></div>

          <div class="section">
            <label>Weekly intention</label>
            <input id="intention" placeholder="ex: stay calm, stay on top of school, move my body" />
          </div>

          <div class="section">
            <label>Mini list</label>
            <textarea id="miniList" placeholder="• things to do\n• things to buy\n• things to remember"></textarea>
          </div>

          <div class="row">
            <button class="btn" id="exportBtn">Export JSON</button>
            <button class="btn danger" id="resetBtn">Reset</button>
          </div>

          <footer>paper + blush + calm — localStorage only</footer>
        </div>
      </aside>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modalOverlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Event editor">
      <div class="head">
        <b id="modalTitle">New event</b>
        <button class="btn" id="closeModal">Close</button>
      </div>
      <div class="body section">
        <div class="two">
          <div>
            <label>Title</label>
            <input id="evTitle" placeholder="ex: tennis practice" />
          </div>
          <div>
            <label>Category</label>
            <select id="evCategory"></select>
          </div>
        </div>

        <div class="three">
          <div>
            <label>Date</label>
            <input id="evDate" type="date" />
          </div>
          <div>
            <label>Start</label>
            <input id="evStart" type="time" />
          </div>
          <div>
            <label>End</label>
            <input id="evEnd" type="time" />
          </div>
        </div>

        <div>
          <label>Notes</label>
          <textarea id="evNotes" placeholder="optional"></textarea>
        </div>

        <div class="rightActions">
          <button class="btn danger" id="deleteBtn" style="display:none;">Delete</button>
          <button class="btn primary" id="saveBtn">Save</button>
        </div>

        <div class="muted" id="saveHint"></div>
      </div>
    </div>
  </div>

  <script>
    // ---------- DaybyDay-ish data + localStorage ----------
    const STORAGE_KEY = "daybyday_singlefile_v1";

    const CATEGORIES = [
      { id: "school", name: "School", color: "#E06A89" },
      { id: "social", name: "Social", color: "#F0A0B4" },
      { id: "athletics", name: "Athletics", color: "#CFA4E8" },
      { id: "personal", name: "Personal", color: "#9BB7E8" },
      { id: "health", name: "Health", color: "#9ED6C5" },
      { id: "errands", name: "Errands", color: "#E7C48A" }
    ];

    function uid() {
      return Math.random().toString(16).slice(2) + Date.now().toString(16);
    }

    function startOfWeek(d) {
      const date = new Date(d);
      const day = (date.getDay() + 6) % 7; // Monday=0
      date.setHours(0,0,0,0);
      date.setDate(date.getDate() - day);
      return date;
    }

    function fmtDateISO(d){
      const x = new Date(d);
      const y = x.getFullYear();
      const m = String(x.getMonth()+1).padStart(2,"0");
      const da = String(x.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }

    function fmtShort(d){
      return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(d);
    }

    function fmtWeekLabel(weekStart){
      const a = new Date(weekStart);
      const b = new Date(weekStart);
      b.setDate(b.getDate()+6);
      const sameMonth = a.getMonth() === b.getMonth();
      const monthA = new Intl.DateTimeFormat(undefined, { month:"long" }).format(a);
      const monthB = new Intl.DateTimeFormat(undefined, { month:"long" }).format(b);
      const year = a.getFullYear();
      return sameMonth
        ? `${monthA} ${a.getDate()}–${b.getDate()}, ${year}`
        : `${monthA} ${a.getDate()} – ${monthB} ${b.getDate()}, ${year}`;
    }

    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return { events: [], intention: "", miniList: "" };
        const parsed = JSON.parse(raw);
        return {
          events: Array.isArray(parsed.events) ? parsed.events : [],
          intention: typeof parsed.intention === "string" ? parsed.intention : "",
          miniList: typeof parsed.miniList === "string" ? parsed.miniList : ""
        };
      }catch{
        return { events: [], intention: "", miniList: "" };
      }
    }

    function saveState(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // ---------- State ----------
    let state = loadState();
    let weekStart = startOfWeek(new Date());
    let editingId = null;

    // ---------- Elements ----------
    const weekGrid = document.getElementById("weekGrid");
    const weekLabel = document.getElementById("weekLabel");
    const todayPill = document.getElementById("todayPill");
    const prevWeek = document.getElementById("prevWeek");
    const nextWeek = document.getElementById("nextWeek");
    const newEventBtn = document.getElementById("newEventBtn");

    const categoryChips = document.getElementById("categoryChips");
    const intentionEl = document.getElementById("intention");
    const miniListEl = document.getElementById("miniList");

    const exportBtn = document.getElementById("exportBtn");
    const resetBtn = document.getElementById("resetBtn");

    const modalOverlay = document.getElementById("modalOverlay");
    const closeModal = document.getElementById("closeModal");
    const modalTitle = document.getElementById("modalTitle");
    const saveBtn = document.getElementById("saveBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const saveHint = document.getElementById("saveHint");

    const evTitle = document.getElementById("evTitle");
    const evCategory = document.getElementById("evCategory");
    const evDate = document.getElementById("evDate");
    const evStart = document.getElementById("evStart");
    const evEnd = document.getElementById("evEnd");
    const evNotes = document.getElementById("evNotes");

    // ---------- UI Helpers ----------
    function catById(id){
      return CATEGORIES.find(c=>c.id===id) || CATEGORIES[0];
    }

    function setEventBorderColor(el, catId){
      el.style.borderLeftColor = catById(catId).color;
    }

    function openModal({ mode, event=null, presetDate=null }){
      modalOverlay.classList.add("show");
      modalOverlay.setAttribute("aria-hidden", "false");

      // category options
      evCategory.innerHTML = "";
      for(const c of CATEGORIES){
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name;
        evCategory.appendChild(opt);
      }

      if(mode === "edit" && event){
        editingId = event.id;
        modalTitle.textContent = "Edit event";
        deleteBtn.style.display = "inline-flex";

        evTitle.value = event.title || "";
        evCategory.value = event.category || CATEGORIES[0].id;
        evDate.value = event.date;
        evStart.value = event.start || "";
        evEnd.value = event.end || "";
        evNotes.value = event.notes || "";
        saveHint.textContent = "Saved to this device (localStorage).";
      } else {
        editingId = null;
        modalTitle.textContent = "New event";
        deleteBtn.style.display = "none";

        evTitle.value = "";
        evCategory.value = CATEGORIES[0].id;
        evDate.value = presetDate || fmtDateISO(new Date());
        evStart.value = "";
        evEnd.value = "";
        evNotes.value = "";
        saveHint.textContent = "Tip: add a start time to keep your week readable.";
      }

      // focus
      setTimeout(()=>evTitle.focus(), 50);
    }

    function closeModalFn(){
      modalOverlay.classList.remove("show");
      modalOverlay.setAttribute("aria-hidden", "true");
    }

    function upsertEvent(){
      const title = evTitle.value.trim();
      if(!title){
        evTitle.focus();
        saveHint.textContent = "Add a title first.";
        return;
      }
      const payload = {
        id: editingId || uid(),
        title,
        category: evCategory.value,
        date: evDate.value,
        start: evStart.value,
        end: evEnd.value,
        notes: evNotes.value.trim()
      };

      if(editingId){
        state.events = state.events.map(e => e.id === editingId ? payload : e);
      } else {
        state.events = [...state.events, payload];
      }

      saveState();
      render();
      closeModalFn();
    }

    function deleteEvent(){
      if(!editingId) return;
      state.events = state.events.filter(e => e.id !== editingId);
      saveState();
      render();
      closeModalFn();
    }

    // ---------- Render ----------
    function renderCategories(){
      categoryChips.innerHTML = "";
      for(const c of CATEGORIES){
        const chip = document.createElement("span");
        chip.className = "chip";
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = c.color;
        chip.appendChild(dot);
        const text = document.createElement("span");
        text.textContent = c.name;
        chip.appendChild(text);
        categoryChips.appendChild(chip);
      }
    }

    function eventsForDate(dateISO){
      return state.events
        .filter(e => e.date === dateISO)
        .sort((a,b) => (a.start||"").localeCompare(b.start||""));
    }

    function renderWeek(){
      weekGrid.innerHTML = "";
      weekLabel.textContent = fmtWeekLabel(weekStart);

      const today = new Date();
      todayPill.textContent = "Today: " + fmtShort(today);

      const dows = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

      for(let i=0;i<7;i++){
        const day = new Date(weekStart);
        day.setDate(day.getDate()+i);
        const dateISO = fmtDateISO(day);

        const box = document.createElement("div");
        box.className = "day";

        const top = document.createElement("div");
        top.className = "dayTop";
        const left = document.createElement("div");
        const dow = document.createElement("div");
        dow.className = "dow";
        dow.textContent = dows[i];
        const date = document.createElement("div");
        date.className = "date";
        date.textContent = fmtShort(day);
        left.appendChild(dow);
        left.appendChild(date);

        const addBtn = document.createElement("button");
        addBtn.className = "btn";
        addBtn.textContent = "+";
        addBtn.title = "Add event";
        addBtn.onclick = (e)=>{ e.stopPropagation(); openModal({mode:"new", presetDate: dateISO}); };

        top.appendChild(left);
        top.appendChild(addBtn);

        const list = document.createElement("div");
        list.className = "events";

        const items = eventsForDate(dateISO);
        for(const ev of items){
          const evEl = document.createElement("div");
          evEl.className = "event";
          setEventBorderColor(evEl, ev.category);

          const evLeft = document.createElement("div");
          evLeft.className = "left";

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = ev.title;

          const meta = document.createElement("div");
          meta.className = "meta";
          const catName = catById(ev.category).name;
          const time = (ev.start ? ev.start : "") + (ev.end ? `–${ev.end}` : "");
          meta.textContent = [catName, time].filter(Boolean).join(" • ");

          evLeft.appendChild(name);
          evLeft.appendChild(meta);

          evEl.appendChild(evLeft);

          evEl.onclick = ()=> openModal({mode:"edit", event: ev});

          list.appendChild(evEl);
        }

        const addSmall = document.createElement("button");
        addSmall.className = "addSmall";
        addSmall.textContent = "add something…";
        addSmall.onclick = ()=> openModal({mode:"new", presetDate: dateISO});

        box.appendChild(top);
        box.appendChild(list);
        box.appendChild(addSmall);

        weekGrid.appendChild(box);
      }
    }

    function renderRight(){
      intentionEl.value = state.intention;
      miniListEl.value = state.miniList;
    }

    function render(){
      renderCategories();
      renderWeek();
      renderRight();
    }

    // ---------- Events ----------
    prevWeek.addEventListener("click", ()=>{
      const d = new Date(weekStart);
      d.setDate(d.getDate()-7);
      weekStart = d;
      render();
    });

    nextWeek.addEventListener("click", ()=>{
      const d = new Date(weekStart);
      d.setDate(d.getDate()+7);
      weekStart = d;
      render();
    });

    newEventBtn.addEventListener("click", ()=> openModal({mode:"new"}));
    closeModal.addEventListener("click", closeModalFn);
    modalOverlay.addEventListener("click", (e)=>{
      if(e.target === modalOverlay) closeModalFn();
    });

    saveBtn.addEventListener("click", upsertEvent);
    deleteBtn.addEventListener("click", deleteEvent);

    intentionEl.addEventListener("input", ()=>{
      state.intention = intentionEl.value;
      saveState();
    });

    miniListEl.addEventListener("input", ()=>{
      state.miniList = miniListEl.value;
      saveState();
    });

    exportBtn.addEventListener("click", ()=>{
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "daybyday-export.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    resetBtn.addEventListener("click", ()=>{
      if(!confirm("Reset everything on this device?")) return;
      state = { events: [], intention: "", miniList: "" };
      saveState();
      render();
    });

    // keyboard shortcut
    document.addEventListener("keydown", (e)=>{
      if(e.key === "Escape") closeModalFn();
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){
        e.preventDefault();
        openModal({mode:"new"});
      }
    });

    // ---------- Init ----------
    saveState();
    render();
  </script>
</body>
</html>
