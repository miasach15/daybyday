<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>daybyday</title>

  <!-- Single-file app (GitHub Pages friendly) -->
  <style>
    :root{
      --ink:#15151e;
      --muted:#6b7280;
      --line:#e5e7eb;

      --chip-edu:#ffe9f4;
      --chip-ath:#e3f9e8;
      --chip-soc:#e7f3ff;
      --chip-health:#fff9e5;
      --chip-pers:#f1ecff;

      --cat-edu-border:#f9a8d4;
      --cat-ath-border:#86efac;
      --cat-soc-border:#bfdbfe;
      --cat-health-border:#facc15;
      --cat-pers-border:#c4b5fd;

      --pink:#ffeaf5;          /* urgent */
      --pink-border:#fbcfe8;

      --benefit:#eef2ff;
      --benefit-border:#c7d2fe;

      --radius:14px;
      --radius-med:10px;
      --shadow: 0 10px 24px rgba(148,163,184,.22);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text","Segoe UI", sans-serif;
      background:#fff;
      color:var(--ink);
    }

    /* Layout */
    .shell{
      min-height:100vh;
      display:grid;
      grid-template-columns:260px minmax(0,1fr);
    }
    @media (max-width: 900px){
      .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    }

    aside{
      border-right:1px solid rgba(148,163,184,.25);
      padding:22px 16px;
      display:flex;
      flex-direction:column;
      gap:16px;
      background:#fff;
    }
    @media (max-width:900px){
      aside{
        border-right:none;
        border-bottom:1px solid rgba(148,163,184,.25);
        flex-direction:row;
        flex-wrap:wrap;
        align-items:flex-start;
        justify-content:space-between;
      }
    }

    .logo{
      font-family:"Playfair Display","DM Serif Display",serif;
      font-size:22px;
      letter-spacing:.08em;
      text-transform:lowercase;
    }

    .user{
      display:flex;align-items:center;gap:10px;
      padding:8px 10px;border-radius:16px;background:#f8fafc;
      max-width:240px;
    }
    .avatar{width:30px;height:30px;border-radius:999px;background:#e5e7eb}
    .hello{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9ca3af}
    .name{font-size:13px;font-weight:650}
    .name-edit{font-size:10px;color:#6b7280;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
    .nav{display:flex;flex-direction:column;gap:10px;min-width:220px}
    .nav-group{display:flex;flex-direction:column;gap:6px}
    .nav-label{
      font-size:10px;letter-spacing:.16em;text-transform:uppercase;
      color:#94a3b8;margin-top:6px;
    }
    .link{
      display:block;
      padding:8px 11px;
      border-radius:var(--radius-med);
      font-size:13px;
      color:#111827;
      text-decoration:none;
      background:transparent;
      transition:background .15s ease,color .15s ease;
      border:1px solid transparent;
    }
    .link:hover{background:#f3f4f6}
    .link.active{background:#111827;color:#fff}

    main{padding:22px 24px 30px}
    @media (max-width:900px){main{padding:16px 14px 24px}}

    .page{max-width:1200px;margin:0 auto}
    .topbar{
      display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
      margin-bottom:14px;
    }
    .title{
      font-family:"Playfair Display","DM Serif Display",serif;
      font-size:26px;letter-spacing:.18em;text-transform:uppercase;
      margin:0 0 6px;
    }
    .subtitle{margin:0;color:var(--muted);font-size:13px}

    /* Cards / inputs */
    .card{
      border:1px solid rgba(148,163,184,.35);
      border-radius:18px;
      background:#fff;
      box-shadow: 0 8px 20px rgba(148,163,184,.12);
    }
    .card.pad{padding:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width: 900px){ .grid2{grid-template-columns:1fr} }

    .input, .select, .textarea{
      border:1px solid #e5e7eb;border-radius:12px;
      padding:10px 12px;font-size:13px;outline:none;background:#fff;
    }
    .textarea{min-height:140px;resize:vertical;width:100%}
    .btn{
      border:1px solid #e5e7eb;background:#fff;
      border-radius:12px;
      padding:10px 12px;
      font-size:12px;letter-spacing:.12em;text-transform:uppercase;
      cursor:pointer;
    }
    .btn:hover{background:#f3f4f6}
    .btn.primary{background:#111827;color:#fff;border-color:#111827}
    .btn.primary:hover{filter:brightness(1.03)}
    .btn.danger{border-color:#ef4444;color:#ef4444}
    .btn.danger:hover{background:#fff1f2}

    .list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .item{
      display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
      padding:10px 12px;border-radius:14px;border:1px solid #e5e7eb;
      background:#fff;
    }
    .item .left{display:flex;align-items:flex-start;gap:10px;min-width:0;flex:1}
    .item .text{font-size:13px;word-break:break-word}
    .item .meta{font-size:11px;color:#6b7280;margin-top:2px}
    .x{cursor:pointer;font-size:16px;line-height:1;padding:0 6px;color:#6b7280}
    .x:hover{color:#111827}
    .muted{color:var(--muted)}

    /* Pills */
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      border-radius:999px;
      padding:4px 10px;
      font-size:10px;
      border:1px solid #e5e7eb;
      background:#fff;
      letter-spacing:.12em;
      text-transform:uppercase;
      box-shadow:0 3px 8px rgba(148,163,184,.14);
      white-space:nowrap;
    }
    .pill[data-cat="education"]{background:var(--chip-edu);border-color:var(--cat-edu-border)}
    .pill[data-cat="athletics"]{background:var(--chip-ath);border-color:var(--cat-ath-border)}
    .pill[data-cat="social"]{background:var(--chip-soc);border-color:var(--cat-soc-border)}
    .pill[data-cat="health"]{background:var(--chip-health);border-color:var(--cat-health-border)}
    .pill[data-cat="personal"]{background:var(--chip-pers);border-color:var(--cat-pers-border)}

    /* KPI */
    .kpis{
      margin-top:10px;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
    }
    @media (max-width: 900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
    .kpi{
      border:1px solid rgba(148,163,184,.35);
      border-radius:16px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 6px 16px rgba(148,163,184,.12);
    }
    .kpi .n{font-size:18px;font-weight:800}
    .kpi .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6b7280;margin-top:2px}

    /* ========= WEEKLY CALENDAR ========= */
    .wk-range{font-size:13px;color:#4b5563;margin:0 0 6px;text-align:right}
    .wk-nav{display:flex;gap:8px;justify-content:flex-end}
    .wk-nav .btn{padding:8px 12px;border-radius:12px}

    .wk-priority{
      margin:14px 0 14px;
      padding:10px 12px;
      border-radius:16px;
      border:1px solid #e5e7eb;
      background:#fdfdfd;
      display:flex;flex-direction:column;gap:6px;
    }
    .wk-priority-head{
      display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    }
    .wk-priority-title{
      font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:650;
    }
    .wk-priority-sub{font-size:11px;color:#6b7280}
    .wk-key{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:10px;color:#6b7280}
    .dot{width:10px;height:10px;border-radius:999px;border:1px solid #e5e7eb;display:inline-block}
    .dot.urgent{background:var(--pink);border-color:var(--pink-border)}
    .dot.benefit{background:var(--benefit);border-color:var(--benefit-border)}
    .dot.normal{background:#f9fafb;border-color:#e5e7eb}
    .wk-priority-list{display:flex;gap:6px;flex-wrap:wrap}
    .wk-pill{
      border-radius:999px;
      padding:6px 10px;
      border:1px solid #e5e7eb;
      background:#fff;
      box-shadow: 0 3px 8px rgba(148,163,184,.18);
      display:flex;flex-direction:column;gap:2px;
      max-width:100%;
      cursor:default;
    }
    .wk-pill.urgent{background:var(--pink);border-color:var(--pink-border)}
    .wk-pill.benefit{background:var(--benefit);border-color:var(--benefit-border)}
    .wk-pill .t{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wk-pill .m{font-size:10px;color:#6b7280;white-space:nowrap}
    .wk-empty{font-size:11px;color:#9ca3af}

    .wk-category{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .wk-chip{
      border-radius:12px;padding:6px 12px;font-size:11px;
      border:1px solid rgba(148,163,184,.5);
      box-shadow:0 3px 8px rgba(148,163,184,.18);
      background:#fff;
    }
    .wk-chip[data-cat="education"]{background:var(--chip-edu)}
    .wk-chip[data-cat="athletics"]{background:var(--chip-ath)}
    .wk-chip[data-cat="social"]{background:var(--chip-soc)}
    .wk-chip[data-cat="health"]{background:var(--chip-health)}
    .wk-chip[data-cat="personal"]{background:var(--chip-pers)}

    .wk-layout{
      border-radius:18px;
      border:1px solid rgba(148,163,184,.35);
      overflow:hidden;
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      background:#fff;
    }
    .wk-top{
      display:grid;
      grid-template-columns:70px minmax(0,1fr);
      border-bottom:1px solid #e5e7eb;
    }
    .wk-top-left{border-right:1px solid #e5e7eb}
    .wk-top-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
    .wk-scroll{
      display:grid;
      grid-template-columns:70px minmax(0,1fr);
      max-height:640px;
      overflow-y:auto;
    }
    .wk-times{border-right:1px solid #e5e7eb;background:#fff}
    .wk-time-row{
      height:40px;border-top:1px solid #f3f4f6;
      font-size:10px;color:#9ca3af;padding:2px 6px;
    }
    .wk-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
    .wk-day{border-left:1px solid #f3f4f6}
    .wk-day:first-child{border-left:none}
    .wk-day-header{
      padding:8px 10px 4px;border-bottom:1px solid #e5e7eb;
      font-size:11px;background:#fff;
    }
    .wk-day-name{font-weight:650}
    .wk-day-date{font-size:10px;color:#9ca3af}

    .wk-assign-row{
      padding:6px 10px;
      display:flex;gap:6px;align-items:center;
      border-bottom:1px solid #f3f4f6;
      flex-wrap:wrap;
    }
    .wk-assign-type,.wk-assign-cat{
      font-size:10px;border-radius:12px;border:1px solid #e5e7eb;
      padding:4px 6px;background:#fff;flex:0 0 auto;
    }
    .wk-assign-input{
      flex:1 1 auto;min-width:120px;
      font-size:10px;border-radius:12px;border:1px solid #e5e7eb;
      padding:6px 8px;background:#fff;
    }
    .wk-assign-input::placeholder{color:#cbd5e1}

    .wk-assign-chips{
      padding:6px 10px 10px;
      border-bottom:1px solid #f3f4f6;
      display:flex;flex-wrap:wrap;gap:6px;
    }

    /* TASK CHIPS (NOW CATEGORY-COLORED) */
    .task{
      border:1px solid #e5e7eb;
      background:#f9fafb;
      border-radius:999px;
      padding:6px 8px;
      font-size:10px;
      display:inline-flex;align-items:center;gap:6px;
      max-width:100%;
      box-shadow:0 3px 8px rgba(148,163,184,.14);
    }
    .task[data-cat="education"]{background:var(--chip-edu);border-color:var(--cat-edu-border)}
    .task[data-cat="athletics"]{background:var(--chip-ath);border-color:var(--cat-ath-border)}
    .task[data-cat="social"]{background:var(--chip-soc);border-color:var(--cat-soc-border)}
    .task[data-cat="health"]{background:var(--chip-health);border-color:var(--cat-health-border)}
    .task[data-cat="personal"]{background:var(--chip-pers);border-color:var(--cat-pers-border)}

    .task.urgent{box-shadow:0 0 0 2px var(--pink-border) inset}
    .task.benefit{box-shadow:0 0 0 2px var(--benefit-border) inset}
    .task.done{opacity:.75}
    .task.done .task-text{color:#9ca3af;text-decoration:line-through}
    .task-check{width:11px;height:11px;cursor:pointer;flex:0 0 auto}
    .task-dot{
      width:10px;height:10px;border-radius:999px;border:1px solid #d1d5db;
      background:#fff;cursor:pointer;flex:0 0 auto;
    }
    .task-text{
      white-space:normal;
      word-break:break-word;
      max-width:220px;
    }
    .task-x{cursor:pointer;font-size:12px;line-height:1;padding:0 2px;color:#6b7280}
    .task-x:hover{color:#111827}

    .wk-all-day-row{
      padding:4px 10px 6px;
      border-bottom:1px solid #e5e7eb;
      display:flex;gap:6px;align-items:center;font-size:10px;
    }
    .wk-all-day-list{flex:1;display:flex;flex-wrap:wrap;gap:4px}
    .wk-all-day-pill{
      border-radius:12px;padding:3px 8px;font-size:10px;
      background:#e0f2fe;border:1px solid #bfdbfe;cursor:pointer;
    }
    .wk-all-day-pill[data-cat="education"]{background:var(--chip-edu);border-color:var(--cat-edu-border)}
    .wk-all-day-pill[data-cat="athletics"]{background:var(--chip-ath);border-color:var(--cat-ath-border)}
    .wk-all-day-pill[data-cat="social"]{background:var(--chip-soc);border-color:var(--cat-soc-border)}
    .wk-all-day-pill[data-cat="health"]{background:var(--chip-health);border-color:var(--cat-health-border)}
    .wk-all-day-pill[data-cat="personal"]{background:var(--chip-pers);border-color:var(--cat-pers-border)}
    .wk-all-day-add{
      border-radius:12px;border:1px solid #e5e7eb;background:#fff;width:22px;height:22px;
      display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;
    }
    .wk-all-day-add:hover{background:#f3f4f6}

    .wk-day-body{
      position:relative;height:960px;
      background-image:repeating-linear-gradient(to bottom,#f3f4f6 0,#f3f4f6 1px,transparent 1px,transparent 40px);
    }
    .event{
      position:absolute;left:7%;right:7%;
      border-radius:12px;padding:4px 6px;font-size:11px;
      background:#e7f3ff;border:1px solid #bfdbfe;
      box-shadow:0 6px 14px rgba(148,163,184,.45);
      cursor:pointer;overflow:hidden;
    }
    .event[data-cat="education"]{background:var(--chip-edu);border-color:var(--cat-edu-border)}
    .event[data-cat="athletics"]{background:var(--chip-ath);border-color:var(--cat-ath-border)}
    .event[data-cat="social"]{background:var(--chip-soc);border-color:var(--cat-soc-border)}
    .event[data-cat="health"]{background:var(--chip-health);border-color:var(--cat-health-border)}
    .event[data-cat="personal"]{background:var(--chip-pers);border-color:var(--cat-pers-border)}
    .event .et{font-weight:600}
    .event .em{font-size:10px;color:#4b5563}

    /* Modal */
    .overlay{
      position:fixed;inset:0;background:rgba(15,23,42,.2);
      display:none;align-items:center;justify-content:center;z-index:50;
    }
    .overlay.show{display:flex}
    .modal{
      width:100%;max-width:460px;background:#fff;border-radius:18px;
      box-shadow:0 24px 60px rgba(15,23,42,.45);
      padding:16px 16px 14px;
      margin:0 12px;
    }
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .modal-title{font-size:14px;font-weight:700}
    .close{border:none;background:none;font-size:18px;cursor:pointer}
    .field{display:flex;gap:8px;align-items:center;margin-bottom:10px}
    .field label{flex:0 0 70px;font-size:11px;color:#6b7280}
    .field .input,.field .select{flex:1}
    .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
    .del{border:none;background:none;font-size:11px;color:#ef4444;cursor:pointer}
    .save{border:none;border-radius:12px;padding:8px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:#111827;color:#fff;cursor:pointer}
  </style>
</head>

<body>
<div class="shell">
  <aside>
    <div>
      <div class="logo">daybyday</div>
      <div class="user">
        <div class="avatar"></div>
        <div style="min-width:0">
          <div class="hello">welcome back</div>
          <div class="name" id="userName">your name</div>
          <div class="name-edit" id="editName">edit name</div>
        </div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-group">
        <div class="nav-label">planning</div>
        <a class="link" href="#/weekly" data-route="/weekly">weekly calendar</a>
        <a class="link" href="#/goals" data-route="/goals">goals hub</a>
        <a class="link" href="#/habits" data-route="/habits">habits</a>
      </div>

      <div class="nav-group">
        <div class="nav-label">lifestyle</div>
        <a class="link" href="#/movies" data-route="/movies">movies</a>
        <a class="link" href="#/shows" data-route="/shows">shows</a>
        <a class="link" href="#/books" data-route="/books">books</a>
        <a class="link" href="#/music" data-route="/music">music</a>
        <a class="link" href="#/places" data-route="/places">places</a>
        <a class="link" href="#/wishlist" data-route="/wishlist">wishlist</a>
        <a class="link" href="#/journal" data-route="/journal">journal</a>
      </div>

      <div class="nav-group">
        <div class="nav-label">wellness</div>
        <a class="link" href="#/workouts" data-route="/workouts">workouts</a>
        <a class="link" href="#/meals" data-route="/meals">meals</a>
        <a class="link" href="#/skincare" data-route="/skincare">skincare</a>
        <a class="link" href="#/affirmations" data-route="/affirmations">affirmations</a>
      </div>

      <div class="nav-group">
        <div class="nav-label">settings</div>
        <a class="link" href="#/data" data-route="/data">export / reset</a>
      </div>
    </nav>
  </aside>

  <main>
    <div id="app" class="page"></div>
  </main>
</div>

<!-- EVENT MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">new event</div>
      <button class="close" id="closeModal">×</button>
    </div>

    <div class="field">
      <label>title</label>
      <input class="input" id="evTitle" placeholder="practice, dinner, meeting…" />
    </div>

    <div class="field">
      <label>time</label>
      <input class="input" id="evStart" placeholder="4:00 pm" />
      <input class="input" id="evEnd" placeholder="5:30 pm" />
    </div>

    <div class="field">
      <label>category</label>
      <select class="select" id="evCat">
        <option value="education">education</option>
        <option value="athletics">athletics</option>
        <option value="social">social</option>
        <option value="health">health</option>
        <option value="personal">personal</option>
      </select>
    </div>

    <div class="field">
      <label>repeat</label>
      <select class="select" id="evRepeat">
        <option value="none">none</option>
        <option value="weekly">weekly</option>
      </select>
    </div>

    <div class="field">
      <label></label>
      <label style="display:flex;gap:8px;align-items:center;font-size:11px;color:#4b5563;">
        <input type="checkbox" id="evAllDay" />
        all day
      </label>
    </div>

    <div class="foot">
      <button class="del" id="deleteEvent">delete</button>
      <button class="save" id="saveEvent">save</button>
    </div>
  </div>
</div>

<script>
/* ==========================
   STORAGE KEYS
========================== */
const LS = {
  name: "daybyday_profile_name",
  weeklyEvents: "daybyday_weekly_events_v5",
  weeklyTasks:  "daybyday_weekly_tasks_v2",

  goals: "daybyday_goals_v2",
  habits:"daybyday_habits_v1",

  movies:"daybyday_movies_v2",
  shows:"daybyday_shows_v1",
  books:"daybyday_books_v2",
  music:"daybyday_music_v1",
  places:"daybyday_places_v1",

  wishlist:"daybyday_wishlist_v2",
  workouts:"daybyday_workouts_v1",
  meals:"daybyday_meals_v1",
  skincare:"daybyday_skincare_v1",
  affirmations:"daybyday_affirmations_v1",

  journal:"daybyday_journal_v1"
};

function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function uid(){
  return "id_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function catPill(cat){
  const c = cat || "personal";
  return `<span class="pill" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</span>`;
}
function renderKPI(obj){
  const entries = Object.values(obj || {});
  return `
    <div class="kpis">
      ${entries.map(x=>`
        <div class="kpi">
          <div class="n">${escapeHtml(String(x.n ?? 0))}</div>
          <div class="l">${escapeHtml(String(x.l ?? ""))}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function emptyMsg(msg){ return `<div class="muted" style="font-size:12px;padding:8px 2px;">${escapeHtml(msg)}</div>`; }

function renderCollectionPage(cfg){
  const data = loadJSON(cfg.storageKey, []);

  // basic counts
  const total = data.length;
  const doneKey = (cfg.fields.status?.options || []).includes("done") ? "done" : null;
  const done = doneKey ? data.filter(x=>x.status===doneKey).length : data.filter(x=>x.status==="done").length;
  const active = total - done;
  const high = data.filter(x=>(x.priority||"") === "high" && (x.status||"") !== "done" && (x.status||"") !== "bought").length;

  app.innerHTML = `
    <div class="topbar">
      <div>
        <h1 class="title">${escapeHtml(cfg.title)}</h1>
        <p class="subtitle">${escapeHtml(cfg.sub || "")}</p>
      </div>
    </div>

    ${renderKPI({
      a:{n: total, l:"items"},
      b:{n: active, l:"active"},
      c:{n: done, l:"done"},
      d:{n: high, l:"high priority"}
    })}

    <div class="card pad" style="margin-top:12px">
      <div class="grid2">
        <div>
          <div class="muted" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">add</div>
          <input class="input" id="fTitle" placeholder="${escapeHtml(cfg.fields.title.placeholder || "title")}" style="width:100%;margin-bottom:8px" />

          <div class="grid2" style="gap:8px">
            <select class="select" id="fCat" style="width:100%">
              ${(cfg.fields.category.options || ["personal","social","health","education","athletics"]).map(o=>
                `<option value="${escapeHtml(o)}"${o===cfg.fields.category.default?" selected":""}>${escapeHtml(o)}</option>`
              ).join("")}
            </select>

            <select class="select" id="fStatus" style="width:100%">
              ${(cfg.fields.status.options || ["to do","done"]).map(o=>
                `<option value="${escapeHtml(o)}"${o===cfg.fields.status.default?" selected":""}>${escapeHtml(o)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="grid2" style="gap:8px;margin-top:8px">
            ${cfg.fields.price ? `<input class="input" id="fPrice" placeholder="${escapeHtml(cfg.fields.price.placeholder||"price")}" style="width:100%" />` : ``}
            ${cfg.fields.link ? `<input class="input" id="fLink" placeholder="${escapeHtml(cfg.fields.link.placeholder||"link")}" style="width:100%" />` : ``}
            ${(!cfg.fields.price && !cfg.fields.link) ? `<input class="input" id="fRating" placeholder="${escapeHtml(cfg.fields.rating.placeholder||"rating")}" style="width:100%" />` : ``}
            ${(cfg.fields.price && cfg.fields.link) ? `` : ``}
          </div>

          <div class="grid2" style="gap:8px;margin-top:8px">
            ${cfg.fields.priority ? `
              <select class="select" id="fPriority" style="width:100%">
                ${(cfg.fields.priority.options || ["low","normal","high"]).map(o=>
                  `<option value="${escapeHtml(o)}"${o===cfg.fields.priority.default?" selected":""}>${escapeHtml(o)}</option>`
                ).join("")}
              </select>
            ` : `
              <select class="select" id="fPriority" style="width:100%">
                <option value="low">low</option>
                <option value="normal" selected>normal</option>
                <option value="high">high</option>
              </select>
            `}

            <input class="input" id="fRating" placeholder="${escapeHtml(cfg.fields.rating.placeholder||"0–10")}" style="width:100%" />
          </div>

          <textarea class="textarea" id="fExtra" placeholder="${escapeHtml(cfg.fields.extra.placeholder || "notes…")}" style="margin-top:8px"></textarea>

          <div class="row" style="margin-top:10px">
            <button class="btn primary" id="addBtn">add</button>
            <button class="btn" id="clearBtn">clear</button>
          </div>
        </div>

        <div>
          <div class="row">
            <input class="input" id="q" placeholder="search…" style="flex:1;min-width:200px" />
            <select class="select" id="filterStatus">
              <option value="all">all</option>
              ${(cfg.fields.status.options || []).map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("")}
            </select>
            <select class="select" id="sort">
              <option value="new">newest</option>
              <option value="old">oldest</option>
              <option value="title">title</option>
              <option value="rating">rating</option>
              <option value="priority">priority</option>
            </select>
          </div>

          <div class="list" id="list"></div>
        </div>
      </div>
    </div>
  `;

  const fTitle = document.getElementById("fTitle");
  const fCat = document.getElementById("fCat");
  const fStatus = document.getElementById("fStatus");
  const fPrice = document.getElementById("fPrice");
  const fLink = document.getElementById("fLink");
  const fPriority = document.getElementById("fPriority");
  const fRating = document.getElementById("fRating");
  const fExtra = document.getElementById("fExtra");

  const q = document.getElementById("q");
  const filterStatus = document.getElementById("filterStatus");
  const sort = document.getElementById("sort");
  const list = document.getElementById("list");

  function clearForm(){
    fTitle.value="";
    if(fPrice) fPrice.value="";
    if(fLink) fLink.value="";
    fPriority.value = (cfg.fields.priority?.default || "normal");
    fRating.value="";
    fExtra.value="";
    fCat.value = (cfg.fields.category.default || "personal");
    fStatus.value = (cfg.fields.status.default || (cfg.fields.status.options||[])[0] || "to do");
  }

  function add(){
    const title = (fTitle.value||"").trim();
    if(!title) return;

    const it = {
      id: uid(),
      title,
      category: fCat.value || "personal",
      status: fStatus.value || "to do",
      priority: fPriority.value || "normal",
      rating: (fRating.value||"").trim(),
      extra: (fExtra.value||"").trim(),
      createdAt: Date.now()
    };
    if(fPrice) it.price = (fPrice.value||"").trim();
    if(fLink) it.link = (fLink.value||"").trim();

    data.unshift(it);
    saveJSON(cfg.storageKey, data);
    clearForm();
    draw();
  }

  function prioScore(p){ return p==="high"?0 : p==="normal"?1 : 2; }
  function ratingNum(v){
    const n = Number(v);
    return Number.isFinite(n) ? n : -1;
  }

  function draw(){
    const query = (q.value||"").trim().toLowerCase();
    const st = filterStatus.value;
    const s = sort.value;

    let filtered = [...data];

    if(st !== "all") filtered = filtered.filter(x => (x.status||"") === st);

    if(query){
      filtered = filtered.filter(x =>
        (x.title||"").toLowerCase().includes(query) ||
        (x.extra||"").toLowerCase().includes(query) ||
        (x.category||"").toLowerCase().includes(query)
      );
    }

    if(s==="new") filtered.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(s==="old") filtered.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(s==="title") filtered.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
    if(s==="rating") filtered.sort((a,b)=>ratingNum(b.rating)-ratingNum(a.rating));
    if(s==="priority") filtered.sort((a,b)=>prioScore(a.priority)-prioScore(b.priority));

    list.innerHTML = "";
    if(!filtered.length){
      list.innerHTML = emptyMsg("nothing here yet.");
      return;
    }

    filtered.forEach(x=>{
      const rating = ratingNum(x.rating) >= 0 ? `${escapeHtml(String(x.rating))}/10` : "—";
      const link = (x.link||"").trim();
      const linkHtml = link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noreferrer" style="font-size:11px">open link</a>` : "";
      const priceHtml = x.price ? `<span class="meta">${escapeHtml(x.price)}</span>` : "";

      list.insertAdjacentHTML("beforeend", `
        <div class="item" data-id="${escapeHtml(x.id)}">
          <div class="left">
            <div style="min-width:0;flex:1">
              <div class="text">
                <strong>${escapeHtml(x.title||"")}</strong>
                <span style="margin-left:8px">${catPill(x.category)}</span>
              </div>
              <div class="meta">
                ${escapeHtml(x.status||"")} · ${escapeHtml(x.priority||"normal")} · rating ${escapeHtml(rating)}
                ${x.price ? " · "+escapeHtml(x.price) : ""}
              </div>
              ${linkHtml ? `<div style="margin-top:6px">${linkHtml}</div>` : ""}
              ${(x.extra||"").trim() ? `<div class="meta" style="margin-top:6px">${escapeHtml(x.extra)}</div>` : ""}
            </div>
          </div>
          <div class="x" title="delete">×</div>
        </div>
      `);
    });

    list.querySelectorAll(".item .x").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.closest(".item").getAttribute("data-id");
        const idx = data.findIndex(it=>it.id===id);
        if(idx>-1){
          data.splice(idx,1);
          saveJSON(cfg.storageKey, data);
          draw();
        }
      };
    });
  }

  document.getElementById("addBtn").onclick = add;
  document.getElementById("clearBtn").onclick = clearForm;
  q.oninput = draw;
  filterStatus.onchange = draw;
  sort.onchange = draw;
  fTitle.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });

  draw();
}

function renderGoalsHub(){
  const data = loadJSON(LS.goals, []);
  const total = data.length;
  const done = data.filter(x=>x.done).length;
  const active = total - done;
  const high = data.filter(x=>x.priority==="high" && !x.done).length;

  app.innerHTML = `
    <div class="topbar">
      <div>
        <h1 class="title">goals hub</h1>
        <p class="subtitle">big goals, small steps. track category + deadline + progress.</p>
      </div>
    </div>

    ${renderKPI({
      a:{n: total, l:"goals"},
      b:{n: active, l:"active"},
      c:{n: done, l:"done"},
      d:{n: high, l:"high priority"}
    })}

    <div class="card pad" style="margin-top:12px">
      <div class="grid2">
        <div>
          <div class="muted" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">add goal</div>

          <input class="input" id="gTitle" placeholder="goal title" style="width:100%;margin-bottom:8px" />

          <div class="grid2" style="gap:8px">
            <select class="select" id="gCat">
              <option value="education">education</option>
              <option value="athletics">athletics</option>
              <option value="social">social</option>
              <option value="health">health</option>
              <option value="personal">personal</option>
            </select>
            <select class="select" id="gPriority">
              <option value="low">low</option>
              <option value="normal" selected>normal</option>
              <option value="high">high</option>
            </select>
          </div>

          <div class="grid2" style="gap:8px;margin-top:8px">
            <input class="input" id="gDeadline" type="date" />
            <input class="input" id="gProgress" placeholder="progress % (0–100)" />
          </div>

          <textarea class="textarea" id="gSteps" placeholder="steps (one per line)"></textarea>
          <textarea class="textarea" id="gNotes" placeholder="notes (why it matters / what’s blocking you)"></textarea>

          <div class="row" style="margin-top:10px">
            <button class="btn primary" id="gAdd">add</button>
            <button class="btn" id="gClear">clear</button>
          </div>
        </div>

        <div>
          <div class="row">
            <input class="input" id="gSearch" placeholder="search…" style="flex:1;min-width:200px" />
            <select class="select" id="gFilter">
              <option value="all">all</option>
              <option value="active">active</option>
              <option value="done">done</option>
              <option value="high">high priority</option>
            </select>
            <select class="select" id="gSort">
              <option value="new">newest</option>
              <option value="deadline">deadline</option>
              <option value="progress">progress</option>
              <option value="title">title</option>
            </select>
          </div>

          <div class="list" id="gList"></div>
        </div>
      </div>
    </div>
  `;

  const gTitle = document.getElementById("gTitle");
  const gCat = document.getElementById("gCat");
  const gPriority = document.getElementById("gPriority");
  const gDeadline = document.getElementById("gDeadline");
  const gProgress = document.getElementById("gProgress");
  const gSteps = document.getElementById("gSteps");
  const gNotes = document.getElementById("gNotes");

  const gSearch = document.getElementById("gSearch");
  const gFilter = document.getElementById("gFilter");
  const gSort = document.getElementById("gSort");
  const gList = document.getElementById("gList");

  function clearForm(){
    gTitle.value="";
    gCat.value="personal";
    gPriority.value="normal";
    gDeadline.value="";
    gProgress.value="";
    gSteps.value="";
    gNotes.value="";
  }

  function add(){
    const title = (gTitle.value||"").trim();
    if(!title) return;
    let prog = Number((gProgress.value||"").trim());
    if(!Number.isFinite(prog)) prog = 0;
    prog = Math.max(0, Math.min(100, prog));

    data.unshift({
      id: uid(),
      title,
      category: gCat.value || "personal",
      priority: gPriority.value || "normal",
      deadline: gDeadline.value || "",
      progress: prog,
      steps: (gSteps.value||"").trim(),
      notes: (gNotes.value||"").trim(),
      done:false,
      createdAt: Date.now()
    });
    saveJSON(LS.goals, data);
    clearForm();
    draw();
  }

  function draw(){
    const q = (gSearch.value||"").trim().toLowerCase();
    const f = gFilter.value;
    const s = gSort.value;

    let filtered = [...data];

    if(f==="active") filtered = filtered.filter(x=>!x.done);
    if(f==="done") filtered = filtered.filter(x=>!!x.done);
    if(f==="high") filtered = filtered.filter(x=>x.priority==="high" && !x.done);

    if(q){
      filtered = filtered.filter(x =>
        (x.title||"").toLowerCase().includes(q) ||
        (x.notes||"").toLowerCase().includes(q) ||
        (x.steps||"").toLowerCase().includes(q)
      );
    }

    if(s==="new") filtered.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(s==="title") filtered.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
    if(s==="progress") filtered.sort((a,b)=>(b.progress||0)-(a.progress||0));
    if(s==="deadline") filtered.sort((a,b)=> (a.deadline||"9999-99-99").localeCompare(b.deadline||"9999-99-99"));

    gList.innerHTML = "";
    if(!filtered.length){
      gList.innerHTML = emptyMsg("no goals yet.");
      return;
    }

    filtered.forEach(x=>{
      const steps = (x.steps||"").trim();
      const stepsPreview = steps ? steps.split("\n").slice(0,3).map(s=>s.trim()).filter(Boolean).join(" · ") : "";
      gList.insertAdjacentHTML("beforeend", `
        <div class="item" data-id="${escapeHtml(x.id)}">
          <div class="left">
            <input type="checkbox" class="gDone" ${x.done?"checked":""} />
            <div style="min-width:0;flex:1">
              <div class="text" style="${x.done?'text-decoration:line-through;color:#9ca3af':''}">
                <strong>${escapeHtml(x.title||"")}</strong>
                <span style="margin-left:8px">${catPill(x.category)}</span>
              </div>
              <div class="meta">
                ${escapeHtml(x.priority||"normal")} · ${x.deadline ? "deadline "+escapeHtml(x.deadline) : "no deadline"} · ${escapeHtml(String(x.progress||0))}%
              </div>
              ${stepsPreview ? `<div class="meta" style="margin-top:6px">${escapeHtml(stepsPreview)}${steps.split("\n").length>3?"…":""}</div>` : ""}
              ${(x.notes||"").trim() ? `<div class="meta" style="margin-top:6px">${escapeHtml(x.notes)}</div>` : ""}
            </div>
          </div>
          <div class="x" title="delete">×</div>
        </div>
      `);

            </select>
            <select class="select" id="hFreq">
              <option value="daily">daily</option>
              <option value="weekdays">weekdays</option>
              <option value="weekends">weekends</option>
            </select>
          </div>

        <div>
          <div class="row">
            <input class="input" id="hSearch" placeholder="search…" style="flex:1;min-width:200px" />
            <select class="select" id="hFilter">
              <option value="active">active</option>
              <option value="all">all</option>
              <option value="archived">archived</option>
            </select>
          </div>

          <div class="card pad" style="margin-top:10px">
            <div class="row" style="justify-content:space-between">

                <div style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:650">today</div>
                <div class="muted" style="font-size:11px" id="hTodayLabel"></div>

  `;

  const hName = document.getElementById("hName");
  const hCat = document.getElementById("hCat");
  const hFreq = document.getElementById("hFreq");
  const hNotes = document.getElementById("hNotes");
  const hSearch = document.getElementById("hSearch");
  const hFilter = document.getElementById("hFilter");
  const hList = document.getElementById("hList");
  const hTodayList = document.getElementById("hTodayList");
  const hTodayLabel = document.getElementById("hTodayLabel");

  let cursor = new Date();
  cursor.setHours(0,0,0,0);

  function dateKey(d){
    const yyyy=d.getFullYear();
    const mm=String(d.getMonth()+1).padStart(2,"0");
    const dd=String(d.getDate()).padStart(2,"0");
    return `${yyyy}-${mm}-${dd}`;
  }
  function dayName(d){
    return d.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
  }
  function isDue(h, d){
    const day = d.getDay(); // Sun=0
    if(h.freq==="daily") return true;
    if(h.freq==="weekdays") return day>=1 && day<=5;
    if(h.freq==="weekends") return day===0 || day===6;
    return true;
  }

  function clearForm(){
    hName.value="";
    hCat.value="health";
    hFreq.value="daily";
    hNotes.value="";

  function add(){
    const name=(hName.value||"").trim();
    if(!name) return;
    store.habits.unshift({
      id: uid(),
      name,
      category: hCat.value || "health",
      freq: hFreq.value || "daily",
      notes: (hNotes.value||"").trim(),
      log: {},        // { "YYYY-MM-DD": true }
      bestStreak: 0,
      archived:false,
      createdAt: Date.now()
    });
    saveJSON(LS.habits, store);
    clearForm();
    draw();
  }

  function computeStreak(h){
    // streak ending at cursor
    let d = new Date(cursor.getTime());
    let streak = 0;
    while(true){
      if(!isDue(h,d)){
        d.setDate(d.getDate()-1);
        continue;
      }
      const k = dateKey(d);
      if(h.log && h.log[k]){
        streak++;
        d.setDate(d.getDate()-1);
      } else break;
    }
    return streak;
  }

  function drawToday(){
    const ck = dateKey(cursor);
    hTodayLabel.textContent = dayName(cursor);

    const due = store.habits.filter(h=>!h.archived).filter(h=>isDue(h,cursor));
    hTodayList.innerHTML = "";
    if(!due.length){
      hTodayList.innerHTML = emptyMsg("no habits due today.");
      return;
    }

    due.forEach(h=>{
      const checked = !!(h.log && h.log[ck]);
      const streak = computeStreak(h);
      hTodayList.insertAdjacentHTML("beforeend", `
        <div class="item" data-id="${escapeHtml(h.id)}">

            </div>
          </div>
          <div class="x" title="archive">⟂</div>
        </div>
      `);
    });

      chk.onchange = ()=>{
        const id = chk.closest(".item").getAttribute("data-id");
        const h = store.habits.find(x=>x.id===id);
        if(!h) return;
        const k = dateKey(cursor);
        if(!h.log) h.log = {};
        if(chk.checked) h.log[k] = true;
        else delete h.log[k];

        const streak = computeStreak(h);
        h.bestStreak = Math.max(h.bestStreak||0, streak);

        saveJSON(LS.habits, store);
        draw();
      };
    });

    // archive button
    hTodayList.querySelectorAll(".item .x").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.closest(".item").getAttribute("data-id");
        const h = store.habits.find(x=>x.id===id);
        if(!h) return;
        h.archived = true;
        saveJSON(LS.habits, store);
        draw();
      };
    });
  }

  function drawAll(){
    const q=(hSearch.value||"").trim().toLowerCase();
    const f=hFilter.value;

    let filtered=[...store.habits];
    if(f==="active") filtered=filtered.filter(h=>!h.archived);
    if(f==="archived") filtered=filtered.filter(h=>!!h.archived);
    if(q) filtered=filtered.filter(h=> (h.name||"").toLowerCase().includes(q) || (h.notes||"").toLowerCase().includes(q));

    hList.innerHTML="";
    if(!filtered.length){
      hList.innerHTML = emptyMsg("no habits.");
      return;
    }

    filtered.forEach(h=>{
      hList.insertAdjacentHTML("beforeend", `
        <div class="item" data-id="${escapeHtml(h.id)}">
          <div class="left">
            <div style="min-width:0;flex:1">
              <div class="text"><strong>${escapeHtml(h.name)}</strong> <span style="margin-left:8px">${catPill(h.category)}</span></div>

            </div>
          </div>
          <div class="x" title="delete">×</div>
        </div>
      `);
    });

    hList.querySelectorAll(".item .x").forEach(btn=>{

        const idx = store.habits.findIndex(h=>h.id===id);
        if(idx>-1){
          store.habits.splice(idx,1);
          saveJSON(LS.habits, store);
          draw();
        }
      };
    });
  }

  function draw(){
    drawToday();
    drawAll();
  }

  document.getElementById("hAdd").onclick = add;
  document.getElementById("hClear").onclick = clearForm;
  hSearch.oninput = drawAll;
  hFilter.onchange = drawAll;

  document.getElementById("hPrevDay").onclick = ()=>{ cursor.setDate(cursor.getDate()-1); drawToday(); };
  document.getElementById("hNextDay").onclick = ()=>{ cursor.setDate(cursor.getDate()+1); drawToday(); };
  document.getElementById("hToday").onclick = ()=>{ cursor = new Date(); cursor.setHours(0,0,0,0); drawToday(); };

  draw();
}

/* ==========================
   WEEKLY CALENDAR
========================== */
function startOfWeek(d){
  const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (date.getDay()+6)%7; // Mon=0
  date.setDate(date.getDate()-day);
  return date;
}
function weekKey(date){ return date.toISOString().slice(0,10); }
function formatRange(date){
  const end = new Date(date.getTime()); end.setDate(end.getDate()+6);
  const opts={month:"short",day:"numeric"};
  return date.toLocaleDateString(undefined,opts)+" – "+end.toLocaleDateString(undefined,opts);
}
function timeLabelFromMinutes(mins){
  let h=Math.floor(mins/60), m=mins%60;
  const ampm = h<12?"am":"pm";
  const display=((h+11)%12)+1;
  return display+":"+String(m).padStart(2,"0")+" "+ampm;
}
function parseTime(str){
  if(!str) return null;
  const m = str.toLowerCase().match(/(\d{1,2}):(\d{2})\s*(am|pm)?/);
  if(!m) return null;
  let h=parseInt(m[1],10), mm=parseInt(m[2],10);
  const ap=m[3];
  if(ap==="pm" && h<12) h+=12;
  if(ap==="am" && h===12) h=0;
  let total=h*60+mm;
  total=Math.max(0,Math.min(total,24*60));
  return total;
}

let WK = {
  weekStart: startOfWeek(new Date()),
  editingId: null,

};

function getAllEvents(){ return loadJSON(LS.weeklyEvents, []); }
function saveAllEvents(all){ saveJSON(LS.weeklyEvents, all); }

function ensureRepeatingEventsForWeek(){
  const all = getAllEvents();
  const currentKey = weekKey(WK.weekStart);

  const prev = new Date(WK.weekStart.getTime()); prev.setDate(prev.getDate()-7);
  const prevKey = weekKey(prev);

  const prevWeekRepeats = all.filter(e=> e.week===prevKey && e.repeat==="weekly");
  if(!prevWeekRepeats.length) return;

  const currentWeek = all.filter(e=> e.week===currentKey);
  let changed=false;

  prevWeekRepeats.forEach(e=>{
    const exists = currentWeek.some(x =>
      x.day===e.day &&
      (x.title||"")===(e.title||"") &&
      x.startMinutes===e.startMinutes &&
      x.endMinutes===e.endMinutes &&
      !!x.allDay === !!e.allDay &&
      (x.category||"education") === (e.category||"education")
    );
    if(!exists){
      const clone = {...e};
      clone.week=currentKey;
      clone.id=uid();
      all.push(clone);
      changed=true;
    }
  });

  if(changed) saveAllEvents(all);
}

        e.preventDefault();
        const day = parseInt(inp.getAttribute("data-day"),10);
        addTask(day);
      }
    };
  });

  // plus all-day event
  document.querySelectorAll("[data-add-allday]").forEach(btn=>{
    btn.onclick = ()=>{
      const day = parseInt(btn.getAttribute("data-add-allday"),10);
      openEventModal({ day, allDay:true });
    };
  });

  // click grid to add timed event
  document.querySelectorAll("[data-body]").forEach(body=>{
    body.onclick = (e)=>{
      const day = parseInt(body.getAttribute("data-body"),10);
      const rect = body.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const proportion = Math.max(0, Math.min(1, y / rect.height));
      let mins = Math.round((proportion * 24*60)/15)*15;
      mins = Math.min(mins, 24*60-15);
      openEventModal({ day, allDay:false, startMinutes:mins, endMinutes:Math.min(mins+60,24*60) });
    };
  });
}

/* ----- TASKS ----- */
function addTask(day){
  const typeEl = document.querySelector(`.wk-assign-type[data-day="${day}"]`);
  const catEl  = document.querySelector(`.wk-assign-cat[data-day="${day}"]`);
  const inputEl = document.querySelector(`.wk-assign-input[data-day="${day}"]`);
  const text = (inputEl.value||"").trim();
  if(!text) return;

  const type = typeEl ? typeEl.value : "study";
  const category = catEl ? catEl.value : "education";
  const key = weekKey(WK.weekStart);

  const store = getTasksStore();
  if(!store[key]) store[key]={};
  if(!store[key][day]) store[key][day]=[];
  store[key][day].push({ type, text, category, done:false, priority:"normal" });

  saveTasksStore(store);
  inputEl.value="";
  renderTasks();
  renderPriorityBar();
}

function renderTasks(){
  const key = weekKey(WK.weekStart);
  const store = getTasksStore();
  const week = store[key] || {};

  document.querySelectorAll("[data-chips]").forEach(el=> el.innerHTML="");

  Object.keys(week).forEach(dayStr=>{
    const day = parseInt(dayStr,10);
    const el = document.querySelector(`[data-chips="${day}"]`);
    if(!el) return;

    (week[day]||[]).forEach((t, idx)=>{
      const type = t.type || "study";
      const pr = t.priority || "normal";
      const done = !!t.done;
      const cat = t.category || (type==="study"||type==="test"||type==="due" ? "education" : "personal");

      const cls = ["task"];
      if(done) cls.push("done");
      if((type==="study"||type==="due") && pr==="urgent") cls.push("urgent");
      if((type==="study"||type==="due") && pr==="benefit") cls.push("benefit");

      const showDot = (type==="study"||type==="due");

      const node = document.createElement("div");
      node.className = cls.join(" ");
      node.dataset.cat = cat;

      node.innerHTML = `
        <input class="task-check" type="checkbox" ${done?"checked":""} />
        <span class="task-text"><strong>${escapeHtml(type)}</strong> ${escapeHtml(t.text||"")}</span>
        ${showDot?`<button class="task-dot" title="cycle priority"></button>`:""}
        <span class="task-x" title="delete">×</span>
      `;

      node.querySelector(".task-check").onchange = (e)=>{
        t.done = !!e.target.checked;
        saveTasksStore(store);
        renderTasks();
        renderPriorityBar();
      };

      if(showDot){
        node.querySelector(".task-dot").onclick = ()=>{
          const current = t.priority || "normal";
          t.priority = current==="normal" ? "urgent" : current==="urgent" ? "benefit" : "normal";
          saveTasksStore(store);
          renderTasks();
          renderPriorityBar();
        };
      }

      node.querySelector(".task-x").onclick = ()=>{
        week[day].splice(idx,1);
        saveTasksStore(store);
        renderTasks();
        renderPriorityBar();
      };

      el.appendChild(node);
    });
  });
}

/* ----- PRIORITIES ----- */
function renderPriorityBar(){
  const list = document.getElementById("priorityList");
  if(!list) return;

  const key = weekKey(WK.weekStart);
  const store = getTasksStore();
  const week = store[key] || {};
  const items=[];

  Object.keys(week).forEach(dayStr=>{
    const day = parseInt(dayStr,10);
    (week[day]||[]).forEach(t=>{
      const type = t.type || "study";
      const pr = t.priority || "normal";
      if(t.done) return;
      if(!(type==="study"||type==="due")) return;
      if(!(pr==="urgent"||pr==="benefit")) return;
      items.push({ text: t.text||"", type, pr, day });
    });
  });

  const groups = new Map();
  items.forEach(it=>{
    const k = it.type+"||"+it.text.toLowerCase();
    if(!groups.has(k)){
      groups.set(k,{ text: it.text, type: it.type, days:[], highest: it.pr });
    }
    const g = groups.get(k);
    g.days.push(it.day);
    const order = { normal:0, benefit:1, urgent:2 };
    if(order[it.pr] > order[g.highest]) g.highest = it.pr;
  });

  const arr = Array.from(groups.values()).map(g=>{
    g.earliest = Math.min(...g.days);
    g.days = Array.from(new Set(g.days)).sort((a,b)=>a-b);
    return g;
  });

  const prioOrder = { urgent:0, benefit:1, normal:2 };
  arr.sort((a,b)=>{
    if(a.earliest!==b.earliest) return a.earliest-b.earliest;
    return prioOrder[a.highest]-prioOrder[b.highest];
  });

  list.innerHTML = "";
  if(!arr.length){
    list.innerHTML = `<div class="wk-empty">mark a study/due task as urgent or benefit to see it here.</div>`;
    return;
  }

  const short = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  arr.forEach(g=>{
    const pill = document.createElement("div");
    pill.className = "wk-pill " + (g.highest==="urgent" ? "urgent" : "benefit");
    pill.innerHTML = `
      <div class="t">${escapeHtml(g.text||"task")}</div>
      <div class="m">${g.days.map(d=>short[d]).join(", ")} · ${escapeHtml(g.type)}</div>
    `;
    list.appendChild(pill);
  });
}

/* ----- EVENTS ----- */
function getWeekEvents(){
  const all = getAllEvents();
  const key = weekKey(WK.weekStart);
  return { all, week: all.filter(e=>e.week===key), others: all.filter(e=>e.week!==key) };
}

function renderEvents(){
  document.querySelectorAll(".event").forEach(e=>e.remove());
  document.querySelectorAll(".wk-all-day-pill").forEach(e=>e.remove());

  const { week } = getWeekEvents();
  const gridHeight = 960;

  week.forEach(ev=>{
    const day = ev.day;
    if(ev.allDay){
      const list = document.querySelector(`[data-allday="${day}"]`);
      if(!list) return;
      const pill = document.createElement("div");
      pill.className="wk-all-day-pill";
      pill.dataset.cat = ev.category || "education";
      pill.textContent = ev.title || "all-day";
      pill.onclick = (e)=>{ e.stopPropagation(); openEventModal(ev); };
      list.appendChild(pill);
      return;
    }

    const body = document.querySelector(`[data-body="${day}"]`);
    if(!body) return;

    const top = (ev.startMinutes/(24*60))*gridHeight;
    const end = (ev.endMinutes/(24*60))*gridHeight;
    const h = Math.max(24, end-top);

    const box = document.createElement("div");
    box.className="event";
    box.dataset.cat = ev.category || "education";
    box.style.top = top+"px";
    box.style.height = h+"px";
    box.innerHTML = `
      <div class="et">${escapeHtml(ev.title||"event")}</div>
      <div class="em">${timeLabelFromMinutes(ev.startMinutes)}–${timeLabelFromMinutes(ev.endMinutes)}</div>
    `;
    box.onclick = (e)=>{ e.stopPropagation(); openEventModal(ev); };
    body.appendChild(box);
  });
}

/* ----- MODAL LOGIC ----- */
const overlay = document.getElementById("overlay");
const modalTitle = document.getElementById("modalTitle");
const evTitle = document.getElementById("evTitle");
const evStart = document.getElementById("evStart");
const evEnd = document.getElementById("evEnd");
const evCat = document.getElementById("evCat");
const evRepeat = document.getElementById("evRepeat");
const evAllDay = document.getElementById("evAllDay");
const btnClose = document.getElementById("closeModal");
const btnSave = document.getElementById("saveEvent");
const btnDelete = document.getElementById("deleteEvent");

btnClose.onclick = closeModal;
overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeModal(); });

evAllDay.addEventListener("change", ()=>{
  const on = evAllDay.checked;
  evStart.disabled = on;
  evEnd.disabled = on;
  if(on){ evStart.value=""; evEnd.value=""; }
  else{
    evStart.value = timeLabelFromMinutes(WK.defaultStart);
    evEnd.value = timeLabelFromMinutes(Math.min(WK.defaultStart+60,24*60));
  }
});

function openEventModal(ev){
  const isEdit = !!ev.id;
  WK.editingId = isEdit ? ev.id : null;
  WK.currentDay = typeof ev.day === "number" ? ev.day : 0;

  modalTitle.textContent = isEdit ? "edit event" : "new event";
  evTitle.value = ev.title || "";
  evCat.value = ev.category || "education";
  evRepeat.value = ev.repeat || "none";

  const allDay = !!ev.allDay;
  evAllDay.checked = allDay;

  btnDelete.style.visibility = isEdit ? "visible" : "hidden";

  if(allDay){
    evStart.disabled = true; evEnd.disabled = true;
    evStart.value=""; evEnd.value="";
  }else{
    evStart.disabled = false; evEnd.disabled = false;

    const start = (typeof ev.startMinutes==="number") ? ev.startMinutes : WK.defaultStart;
    const end   = (typeof ev.endMinutes==="number") ? ev.endMinutes : Math.min(start+60,24*60);
    WK.defaultStart = start;

    evStart.value = timeLabelFromMinutes(start);
    evEnd.value   = timeLabelFromMinutes(end);
  }

  overlay.classList.add("show");
}

function closeModal(){
  overlay.classList.remove("show");
  WK.editingId = null;
}

btnSave.onclick = ()=>{
  const title = (evTitle.value||"").trim() || "event";
  const category = evCat.value;
  const repeat = evRepeat.value || "none";
  const allDay = !!evAllDay.checked;

  let start = 0, end = 24*60;
  if(!allDay){
    start = parseTime(evStart.value) ?? WK.defaultStart;
    end = parseTime(evEnd.value) ?? Math.min(start+60,24*60);
  }

  const { all, week, others } = getWeekEvents();
  const key = weekKey(WK.weekStart);

  if(WK.editingId){
    const idx = all.findIndex(e=>e.id===WK.editingId);
    if(idx>-1){
      Object.assign(all[idx], { title, category, repeat, allDay, day: WK.currentDay, startMinutes:start, endMinutes:end });
    }
    saveAllEvents(all);
  }else{
    week.push({
      id: uid(),
      week:key,
      day:WK.currentDay,
      title,
      category,
      repeat,
      allDay,
      startMinutes:start,
      endMinutes:end
    });
    saveAllEvents([...others, ...week]);
  }

  closeModal();
  renderEvents();
};

btnDelete.onclick = ()=>{
  if(!WK.editingId) return;
  const all = getAllEvents().filter(e=>e.id!==WK.editingId);
  saveAllEvents(all);
  closeModal();
  renderEvents();
};

/* ==========================
   INIT
========================== */
navigate();
</script>
